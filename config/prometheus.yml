# Prometheus 配置文件 — HealthMind 个性化健康管理助手

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'healthmind'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # HealthMind 主应用指标
  - job_name: 'healthmind-app'
    static_configs:
      - targets: ['healthmind:8000']
        labels:
          service: 'healthmind'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
